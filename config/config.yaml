# Triton Inference Server Configuration
triton:
  server_ip: "192.168.1.80"
  http_port: 8000
  grpc_port: 8001
  model_name: "object_detection"
  device: "auto" # Execution device: auto, gpu (CUDA/TensorRT), or cpu

  # Dedicated Remote GPU Endpoint (e.g., Jetson Orin or NVIDIA GPU Server)
  remote_gpu:
    server_ip: "192.168.1.80"
    http_port: 8000
    grpc_port: 8001
    model_name: "object_detection"

  # Dedicated Remote CPU Endpoint
  remote_cpu:
    server_ip: "192.168.1.80"
    http_port: 8000
    grpc_port: 8001
    model_name: "object_detection"

# MQTT Config
mqtt:
 enabled: "False"
 broker_dns: "10.152.183.204"
 broker_port: 1883
 user: "mqtt-user-01"

# Redis Config
redis:
 enabled: "False"
 host: "192.168.1.XXX"
 port: 6379

# Camera feed locations
locations:
