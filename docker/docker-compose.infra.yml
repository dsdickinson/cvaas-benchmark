services:
  mqtt5:
    image: eclipse-mosquitto:latest
    container_name: cvaas-mqtt5
    ports:
      - "1883:1883" # MQTT protocol
      - "9001:9001" # MQTT over WebSockets
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: cvaas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-log:
  redis-data:

networks:
  default:
    name: cvaas-network
