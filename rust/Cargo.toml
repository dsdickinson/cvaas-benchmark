[package]
name = "cv-infer-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
opencv = { version = "0.102.0", default-features = false, features = ["imgproc", "videoio", "highgui", "imgcodecs"] }
base64 = "0.22"
paho-mqtt = { version = "0.12", default-features = false }
triton-client = "0.2.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
